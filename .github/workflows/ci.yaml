name: build-and-deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    env:
      IMAGE: raedbari/node.js
      TAG: ${{ github.sha }}                 # نفس الوسم سيُستخدم في النشر
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}  # يبني ويدفع الصورة بوسم SHA

  deploy_to_kubernetes:
    needs: build_and_push
    runs-on: self-hosted
    env:
      IMAGE: raedbari/node.js
      TAG: ${{ github.sha }}                 # ينشر بنفس وسم البناء
      NAMESPACE: project-env
      DEPLOYMENT: project-dep
      CONTAINER: nodejs
    steps:
      - name: Set strict bash flags
        shell: bash
        run: set -euo pipefail

      - name: Update Deployment image and rollout
        shell: bash
        run: |
          kubectl -n "$NAMESPACE" set image deployment/"$DEPLOYMENT" \
            "$CONTAINER"="${IMAGE}:${TAG}"

          kubectl -n "$NAMESPACE" annotate deployment/"$DEPLOYMENT" \
            ci.commit="${GITHUB_SHA}" ci.tag="${TAG}" --overwrite

          kubectl -n "$NAMESPACE" rollout status deployment/"$DEPLOYMENT" --timeout=300s

          img=$(kubectl -n "$NAMESPACE" get deploy "$DEPLOYMENT" -o "jsonpath={.spec.template.spec.containers[0].image}")
          printf 'Deployed image: %s\n' "$img"
